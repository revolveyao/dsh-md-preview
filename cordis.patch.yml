# dsh-md-preview bundle patch: inserts this plugin's row into the profile roster.
# The host half (exports ".") serves /md-preview/api; the `dsh.client`
# declaration in package.json loads the browser half (exports "./client"),
# which registers the header button, the markdown tab type and the file tree.
- insert:
    - id: dsh-md-preview
      name: 'dsh-md-preview'
